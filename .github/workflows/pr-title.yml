# Con squash, el título del PR es el commit en main: valida Conventional Commits
# con la misma regla que el hook commit-msg (ADR 0014).
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Solo Node: el validador no tiene dependencias.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - run: printf '%s' "$PR_TITLE" | node scripts/commit-message.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
