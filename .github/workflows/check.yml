# El mismo `pnpm check` que corre el hook pre-push (ADR 0011 y 0012).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala pnpm y el Node de `devEngines.runtime`, y corre `pnpm install`.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      # uv corre `reuse` y `zizmor` con la versión fijada en package.json.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          enable-cache: false

      # Variantes de las fotos (ADR 0004): generarlas desde cero tarda unos
      # 2 minutos. Cada nombre lleva el hash del original y de los parámetros,
      # así que una caché vieja nunca entrega una variante equivocada: el
      # script genera lo que falta y borra lo que sobra.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/photos
          key: photos-${{ hashFiles('photos/originals/**', 'scripts/photos/variants.ts', 'pnpm-lock.yaml') }}
          restore-keys: photos-

      - run: pnpm check

      # El job deploy publica este mismo dist/, sin compilar de nuevo (ADR 0003).
      # Las fotos ya vienen comprimidas: comprimir el zip no ahorra nada.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Publica, corre el smoke y, si falla, vuelve a la versión que estaba
  # activa (ADR 0003, 0013, 0017 y 0018).
  deploy:
    name: deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    # Dos pushes seguidos se publican en orden; nunca se corta un deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        # Con `shell: bash` explícito, Actions agrega `-o pipefail`.
        shell: bash
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin caché: este job tiene el token y no restaura nada que haya
      # escrito otra corrida.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: false
          require-lockfile: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # El rollback vuelve a esta versión exacta: "la anterior" podría ser un
      # intento fallido de este mismo deploy.
      - id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(pnpm exec wrangler deployments status --json | node scripts/deployment.ts)
          echo "Versión activa antes del deploy: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: wrangler deploy (3 intentos, cada 2 minutos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if pnpm exec wrangler deploy; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::El intento $attempt de 3 falló; reintento en 2 minutos."
              sleep 120
            fi
          done
          echo "::error::El deploy falló 3 veces. El sitio sigue en la versión anterior."
          exit 1

      # Espera fija a que la versión se propague, sin reintentos (ADR 0013).
      - id: smoke
        run: |
          sleep 30
          node scripts/smoke.ts https://foto.clemgrass.workers.dev

      - name: rollback si falla el smoke
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          pnpm exec wrangler rollback "$PREVIOUS" --message "smoke falló en $GITHUB_SHA"
          echo "::error::El smoke falló: se volvió a la versión $PREVIOUS."
