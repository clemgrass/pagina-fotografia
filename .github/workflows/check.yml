# El mismo `pnpm check` que corre el hook pre-push (ADR 0011 y 0012).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala pnpm y el Node de `devEngines.runtime`, y corre `pnpm install`.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      # uv corre `reuse` y `zizmor` con la versión fijada en package.json.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          enable-cache: false

      # Variantes de las fotos (ADR 0004): generarlas desde cero tarda unos
      # 2 minutos. Cada nombre lleva el hash del original y de los parámetros,
      # así que una caché vieja nunca entrega una variante equivocada: el
      # script genera lo que falta y borra lo que sobra.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/photos
          key: photos-${{ hashFiles('photos/originals/**', 'scripts/photos/variants.ts', 'pnpm-lock.yaml') }}
          restore-keys: photos-

      - run: pnpm check
